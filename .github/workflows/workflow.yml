name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.9.14'
          cache: 'pip'
          cache-dependency-path: app/requirements.txt

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: telegram-proxy/go.mod

      - name: Run Go vet
        run: go vet ./...
        working-directory: telegram-proxy

      - name: Run Go tests
        run: go test -race -cover ./...
        working-directory: telegram-proxy

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run tests with coverage
        run: make test-cov

  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get short SHA
        id: short-sha
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push weather
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            asmnt/weather:latest
            asmnt/weather:dev-${{ steps.short-sha.outputs.sha_short }}

      - name: Build and push telegram-proxy
        uses: docker/build-push-action@v6
        with:
          context: ./telegram-proxy
          push: true
          tags: |
            asmnt/telegram-proxy:latest
            asmnt/telegram-proxy:dev-${{ steps.short-sha.outputs.sha_short }}
